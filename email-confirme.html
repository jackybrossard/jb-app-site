<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adresse confirmée — MesFinances</title>
<meta name="description" content="Ton adresse e-mail est confirmée, tu peux retourner dans l'application MesFinances.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEECE0;
    --ink: #17241C;
    --ink-soft: #4A5548;
    --rule: #CFCABA;
    --indigo: #5457E5;
    --indigo-deep: #3E40B8;
    --credit: #1F8A4C;
    --serif: 'Fraunces', serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(180deg, transparent, transparent 37px, rgba(23,36,28,0.05) 38px);
    display:flex; align-items:center; justify-content:center;
    padding:28px;
  }
  a{color:inherit;}
  .card{
    max-width:440px; width:100%; text-align:center;
    background:#FCFBF6; border-radius:16px;
    padding:48px 32px 40px;
    box-shadow: 0 24px 60px -20px rgba(23,36,28,0.25);
  }
  .brand{display:inline-flex; align-items:center; gap:10px; font-family:var(--serif); font-weight:600; font-size:19px; letter-spacing:-0.01em; text-decoration:none; margin-bottom:28px;}
  .brand .coin{
    width:28px; height:28px; border-radius:50%; background:var(--indigo); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; font-weight:600;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
  }
  .check{
    width:56px; height:56px; border-radius:50%; background:rgba(31,138,76,0.12);
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
  }
  .check svg{width:26px; height:26px;}
  h1{
    font-family:var(--serif); font-weight:600; font-size:26px;
    line-height:1.15; letter-spacing:-0.01em; margin:0 0 12px;
  }
  p{color:var(--ink-soft); font-size:15px; margin:0 0 28px;}
  .hint{
    font-family:var(--mono); font-size:12px; color:var(--ink-soft);
    background:var(--paper); border-radius:10px; padding:12px 16px; margin:0;
  }
</style>
</head>
<body>

  <div class="card">
    <a class="brand" href="index.html"><span class="coin">M</span>MesFinances</a>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5L9.5 18L20 6" stroke="#1F8A4C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Adresse confirmée</h1>
    <p>Ton adresse e-mail est validée. Tu peux fermer cette page et retourner dans l'application MesFinances pour te connecter.</p>

    <p class="hint">Si l'app ne s'est pas rouverte automatiquement, retrouve-la simplement sur ton écran d'accueil.</p>
  </div>

</body>
</html>
